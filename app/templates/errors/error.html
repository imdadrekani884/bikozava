<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>{{ code }} — {{ title }} | {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF6EE;
      --card: #FFFFFF;
      --gold: #C8A253;
      --text: #241C15;
      --muted: #6E6256;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #FFFDF9 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Cormorant Garamond', 'Noto Naskh Arabic', serif;
      padding: 24px;
    }
    .error-card {
      max-width: 460px;
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(200, 162, 83, 0.35);
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(36, 28, 21, 0.08);
    }
    .error-code {
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 12px;
    }
    p {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      padding: 12px 26px;
      background: linear-gradient(135deg, #D4B263, #B38A38);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a href="/" class="btn">Return to Bikozava</a>
  </div>
</body>
</html>
